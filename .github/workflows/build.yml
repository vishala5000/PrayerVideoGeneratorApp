name: Build and Sign APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Auto-Generate Keystore
        run: |
          keytool -genkeypair -noprompt \
            -alias prayer_key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore app/release.keystore \
            -storepass AutoSignPass2024 \
            -keypass AutoSignPass2024 \
            -dname "CN=Android, O=PrayerApp, C=US" \
            -storetype PKCS12

      - name: Sign APK with apksigner
        run: |
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -n 1)
          APKSIGNER=$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner
          $APKSIGNER sign \
            --ks app/release.keystore \
            --ks-pass pass:AutoSignPass2024 \
            --ks-key-alias prayer_key \
            --key-pass pass:AutoSignPass2024 \
            --out app-release-signed.apk \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: PrayerVideoGenerator-Signed
          path: app-release-signed.apk
