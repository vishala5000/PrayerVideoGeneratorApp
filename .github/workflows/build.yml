name: Build and Sign APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode Keystore
        run: echo "${{ env.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore
        env:
          # These are injected by the Colab script automatically
          KEYSTORE_BASE64: "${{ secrets.KEYSTORE_BASE64 }}" 
          KEYSTORE_PASSWORD: "${{ secrets.KEYSTORE_PASSWORD }}"
          KEY_ALIAS: "${{ secrets.KEY_ALIAS }}"
          KEY_PASSWORD: "${{ secrets.KEY_PASSWORD }}"

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Sign APK with apksigner
        run: |
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -n 1)
          APKSIGNER=$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner
          $APKSIGNER sign \
            --ks app/release.keystore \
            --ks-pass pass:${{ env.KEYSTORE_PASSWORD }} \
            --ks-key-alias ${{ env.KEY_ALIAS }} \
            --key-pass pass:${{ env.KEY_PASSWORD }} \
            --out app-release-signed.apk \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: PrayerVideoGenerator-Signed
          path: app-release-signed.apk
